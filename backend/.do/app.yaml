# DigitalOcean App Platform: the backend service (spec §2, §8). Its Postgres database is on
# Supabase; the connection is a secret like the keys.
# Create once with `doctl apps create --spec backend/.do/app.yaml` (see backend/README.md).
# Secrets have no value here on purpose: enter them in the app's settings on DigitalOcean.
name: queaura-backend
region: nyc
services:
  - name: api
    github:
      repo: akilisha/queaura
      # The branch Phase 3 is built on; switch to the main branch once it is merged.
      branch: claude/sleepy-mayer-6dff0q
      deploy_on_push: true
    source_dir: backend
    environment_slug: node-js
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      # Dev and prod share one Supabase database; each environment keeps its tables in its own
      # schema. This app follows the development branch, so it is dev. Prod gets queaura_prod.
      - key: DATABASE_SCHEMA
        scope: RUN_TIME
        value: queaura_dev
      - key: AI_PROVIDER
        scope: RUN_TIME
        value: anthropic
      - key: AI_MODEL
        scope: RUN_TIME
        value: claude-haiku-5-5
      - key: AI_EFFORT
        scope: RUN_TIME
        value: medium
      - key: AI_PRICE_INPUT
        scope: RUN_TIME
        value: "0.1"
      - key: AI_PRICE_OUTPUT
        scope: RUN_TIME
        value: "0.5"
      # Tried in order when the main provider fails (docs/MODEL_COMPARISON.md):
      # provider:model:input price:output price, in US dollars per million tokens.
      - key: AI_FALLBACKS
        scope: RUN_TIME
        value: openai:gpt-6.1-sol:2:10,deepseek:deepseek-flash:0.3:1.2
      - key: FREE_AI_GAMES
        scope: RUN_TIME
        value: "2"
      - key: QUESTIONS_PER_AI_GAME
        scope: RUN_TIME
        value: "50"
      # Secrets: set in the dashboard (Settings → api → Environment Variables), encrypted there.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEEPSEEK_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_JWT_KEY
        scope: RUN_TIME
        type: SECRET
